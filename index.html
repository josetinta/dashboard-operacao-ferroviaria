*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050403;font-family:'Figtree','Segoe UI',Roboto,Arial,sans-serif;color:#efe7dc}
#stage{position:absolute;left:0;top:0;width:1494px;height:840px;transform-origin:0 0;overflow:hidden;background:radial-gradient(1100px 600px at 50% 0,#17120c,#070605 70%)}
#stage>*,#dyn>*{position:absolute}
.pn>*,.bx>*{position:absolute}
.pn{background:linear-gradient(180deg,#14110d,#0d0b09);border:1px solid #2b2217;border-radius:20px;overflow:hidden}
.pt{left:18px;top:12px;font-size:11.5px;font-weight:600;color:#9a8e80;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}
.mut{color:#8b8175}.go{color:#e0a85f}
svg{display:block;overflow:visible}
svg text{font-family:'Figtree','Segoe UI',Arial,sans-serif}
.lang{width:42px;height:30px;line-height:30px;text-align:center;border-radius:15px;background:#16120e;color:#9a8e80;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid #2b2217}
.lang:hover{color:#fff}.lang.on{background:#d9a35f;border-color:#d9a35f;color:#17110a}
.chip{display:flex;align-items:center;justify-content:center;height:26px;border-radius:13px;background:#1c1710;color:#a89c8c;font-size:12.5px;font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
.chip:hover{color:#fff}
.chip.on{background:#d9a35f;color:#17110a}
.chip.all{background:#3a2d17;color:#f0cf96}
.chip.na{background:#110e0a;color:#4a4136;cursor:default}
.mb{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:12px;border:1px solid #2b2217;background:#12100c;cursor:pointer;white-space:nowrap}
.mb:hover{border-color:#6a5231}
.mb.on{border-color:#d9a35f;background:#1d160c}
.nb{display:flex;align-items:center;justify-content:center;gap:10px;height:44px;border-radius:12px;border:1px solid #241d13;background:#12100c;color:#d8cdbd;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.nb:hover{border-color:#6a5231;color:#fff}
.nb.on{border-color:#d9a35f;background:#1d160c;color:#f0cf96}
.sc{display:flex;align-items:center;justify-content:center;height:24px;padding:0 10px;border-radius:12px;background:#1c1710;color:#a89c8c;font-size:11.5px;font-weight:600;cursor:pointer}
.sc:hover{color:#fff}.sc.on{background:#d9a35f;color:#17110a}
.pill{display:flex;align-items:center;justify-content:center;height:28px;border-radius:14px;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;cursor:pointer}
.pill.em{background:#1c1710;color:#ecdcc3}
.pill.yt{background:rgba(230,33,23,.14);color:#f2857d}.pill.li{background:rgba(10,102,194,.2);color:#7bb8ec}.pill.pf{background:rgba(224,168,95,.14);color:#e6bd7a}.pill.wa{background:rgba(31,168,85,.15);color:#6bcf94}
.pill:hover{filter:brightness(1.3)}
.hit{pointer-events:auto;cursor:pointer}
.rw{cursor:pointer}
#tip{position:fixed;z-index:90;pointer-events:none;display:none;background:#0a0806;border:1px solid #5a4528;color:#f0e4d0;font:600 12.5px 'Figtree','Segoe UI',Arial;padding:5px 10px;white-space:nowrap;border-radius:8px}
#tbl{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center}
#tbl.show{display:flex}
#sheet{width:min(1340px,96vw);height:min(720px,88vh);background:#15120e;border:1px solid #5a4528;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;font-family:'Figtree','Segoe UI',Arial,sans-serif}

#sheet .tp b{flex:1;font-size:16px;color:#e0a85f}
#sheet button{height:30px;padding:0 14px;border:0;border-radius:15px;background:#2a2218;color:#fff;font-weight:600;cursor:pointer;font-family:inherit}
#sheet button:hover{background:#d9a35f;color:#17110a}
#sheet .scr{flex:1;overflow:auto}
#sheet table{border-collapse:collapse;font-size:12.5px;width:100%}
#sheet th{position:sticky;top:0;background:#1d1812;color:#f0cf96;padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid #332a1c}
#sheet td{padding:5px 9px;border-bottom:1px solid #211b13;text-align:right;color:#e8dfd0;white-space:nowrap}
#sheet th:nth-child(-n+3),#sheet td:nth-child(-n+3){text-align:left}
#sheet tr:nth-child(even) td{background:#1a150f}
#sheet td[contenteditable]:focus{outline:2px solid #d9a35f;background:#2e2410}
